services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      API_KEY: ${API_KEY:?set API_KEY before starting Compose}
      COLLECTION: ${COLLECTION:-evidence}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      - model_cache:/home/app/.cache
    depends_on:
      - qdrant
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 180s

  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
  model_cache:
